spring.datasource.url=jdbc:h2:mem:njtprobni_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

app.jwt.secret=test-secret-key-not-for-production-use-0123456789abcdef
app.jwt.trajanje-ms=3600000

spring.mail.host=localhost
spring.mail.port=25

app.payment.account-number=160-0000000000000-00
app.payment.payment-purpose=Prijava za probni prijemni ispit (test)
app.payment.reference-prefix=TEST

app.upload.dir=${java.io.tmpdir}/njtprobni-test-uploads
